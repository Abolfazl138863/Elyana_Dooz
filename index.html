<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دوز </title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1c2033;--mu:#6b7194;--cell:#e6e9f5;--blue:#2f6bff;--red:#ff3b4e}
@media (prefers-color-scheme:dark){:root{--bg:#12141f;--card:#1c2033;--tx:#eef0ff;--mu:#9aa0c8;--cell:#2a2f4a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:460px}
h1{text-align:center;font-size:24px;margin:8px 0 16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
label{display:block;color:var(--mu);font-size:13px;margin:8px 0 6px}
input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--cell);background:var(--bg);color:var(--tx);font-size:16px;text-align:center;direction:ltr}
.modes{display:flex;gap:8px}
.mode{flex:1;padding:12px 6px;border-radius:12px;border:2px solid var(--cell);background:var(--bg);color:var(--tx);cursor:pointer;font-size:14px}
.mode.on{border-color:var(--blue)}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;cursor:pointer}
.btn.sec{background:var(--cell);color:var(--tx)}
.status{text-align:center;font-weight:bold;min-height:28px;margin:4px 0 10px}
.me{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-bottom:8px}
.board{display:grid;direction:ltr;margin:0 auto;width:100%;max-width:420px}
.c{aspect-ratio:1;background:var(--cell);border:0;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-weight:bold}
.c:disabled{cursor:default}
.xo .c{font-size:clamp(36px,16vw,64px)}
.X{color:var(--blue)}.O{color:var(--red)}
.ball{width:78%;height:78%;border-radius:50%;box-shadow:inset -3px -4px 6px #0004,inset 3px 3px 6px #fff5}
.ball.b{background:var(--blue)}.ball.r{background:var(--red)}
.c.win{outline:3px solid #ffc400}
.note{color:var(--mu);font-size:12px;text-align:center;margin-top:8px}
hr{border:0;border-top:1px solid var(--cell);margin:16px 0}
</style>
</head>
<body>
<div class="wrap">
<h1> دوز </h1>

<div id="lobby" class="card">
  <label>نوع بازی </label>
  <div class="modes">
    <button class="mode on" data-m="xo">❌⭕ دوز ۳×۳</button>
    <button class="mode" data-m="ball">🔵🔴 دوز ۷×۷ (توپ)</button>
  </div>
  <button class="btn" id="create">ساخت اتاق جدید</button>
  <hr>
  <label>یا کد اتاق منو وارد کن</label>
  <input id="code" maxlength="10" placeholder="مثلاً 1111">
  <button class="btn sec" id="join">ورود به اتاق</button>
  <div class="note" id="lerr"></div>
</div>

<div id="game" class="card" style="display:none">
  <div class="me"><span>کد اتاق: <b id="rc"></b></span><span id="who"></span></div>
  <div class="status" id="st"></div>
  <div id="bd" class="board"></div>
  <button class="btn sec" id="again" style="display:none">بازی دوباره</button>
  <button class="btn sec" id="leave">خروج</button>
  <div class="note" id="gnote"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const CFG = { xo: { n: 3, win: 3 }, ball: { n: 7, win: 4 } };
let mode = 'xo', peer = null, conn = null, role = 0, S = null, code = '';

document.querySelectorAll('.mode').forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x === b));
});

function fresh(m, turn) {
  const { n, win } = CFG[m];
  return { mode: m, n, win, cells: Array(n * n).fill(0), turn: turn || 1, winner: 0, line: [], ready: !!(conn && conn.open) };
}

function check(cells, n, win) {
  const D = [[1, 0], [0, 1], [1, 1], [1, -1]];
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const v = cells[y * n + x];
    if (!v) continue;
    for (const [dx, dy] of D) {
      const line = [y * n + x];
      for (let k = 1; k < win; k++) {
        const xx = x + dx * k, yy = y + dy * k;
        if (xx < 0 || xx >= n || yy < 0 || yy >= n || cells[yy * n + xx] !== v) break;
        line.push(yy * n + xx);
      }
      if (line.length === win) return { winner: v, line };
    }
  }
  return cells.every(c => c) ? { winner: 3, line: [] } : null;
}

function showGame() { $('lobby').style.display = 'none'; $('game').style.display = 'block'; $('rc').textContent = code; }
function backToLobby(msg) {
  if (peer) peer.destroy();
  peer = conn = null; role = 0; S = null;
  $('game').style.display = 'none'; $('lobby').style.display = 'block';
  $('lerr').textContent = msg || '';
}
function push() { if (conn && conn.open) conn.send(S); }

// ---------- میزبان (بازیکن ۱) ----------
$('create').onclick = () => {
  code = String(Math.floor(1000 + Math.random() * 9000));
  role = 1;
  peer = new Peer('doz-' + code);
  peer.on('open', () => { S = fresh(mode); showGame(); render(); });
  peer.on('connection', c => {
    if (conn && conn.open) { c.close(); return; }
    conn = c;
    c.on('open', () => { S.ready = true; render(); push(); });
    c.on('data', d => { if (d.t === 'move') applyMove(2, d.i); if (d.t === 'again') rematch(); });
    c.on('close', () => { conn = null; S.ready = false; S = fresh(S.mode); render(); $('gnote').textContent = 'حریفت خارج شد.'; });
  });
  peer.on('error', e => backToLobby(e.type === 'unavailable-id' ? 'این کد قبلاً گرفته شده، دوباره امتحان کن.' : 'خطا در اتصال: ' + e.type));
};

// ---------- مهمان (بازیکن ۲) ----------
$('join').onclick = () => {
  code = $('code').value.trim().replace(/[^0-9]/g, '');
  if (!code) { $('lerr').textContent = 'کد اتاق رو وارد کن.'; return; }
  role = 2;
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect('doz-' + code, { reliable: true });
    conn.on('open', () => showGame());
    conn.on('data', d => { S = d; render(); });
    conn.on('close', () => backToLobby('ارتباط با میزبان قطع شد.'));
  });
  peer.on('error', e => backToLobby(e.type === 'peer-unavailable' ? 'اتاقی با این کد پیدا نشد.' : 'خطا در اتصال: ' + e.type));
};

// ---------- منطق حرکت (فقط روی میزبان) ----------
function applyMove(side, i) {
  if (!S || !S.ready || S.winner || S.turn !== side) return;
  if (!Number.isInteger(i) || i < 0 || i >= S.cells.length || S.cells[i]) return;
  S.cells[i] = side;
  const r = check(S.cells, S.n, S.win);
  if (r) { S.winner = r.winner; S.line = r.line; } else S.turn = side === 1 ? 2 : 1;
  render(); push();
}
function rematch() {
  if (!S || !S.winner) return;
  S = fresh(S.mode, S.winner === 1 ? 2 : 1); S.ready = true;
  render(); push();
}

function onCell(i) { if (role === 1) applyMove(1, i); else conn.send({ t: 'move', i }); }
$('again').onclick = () => { if (role === 1) rematch(); else conn.send({ t: 'again' }); };
$('leave').onclick = () => backToLobby();

function render() {
  if (!S) return;
  const xo = S.mode === 'xo', side = role;
  const names = xo ? ['❌ X', '⭕ O'] : ['🔵 آبی', '🔴 قرمز'];
  $('who').textContent = 'تو: ' + names[side - 1];
  let st;
  if (!S.ready) st = 'منتظر حریف... کد اتاق رو بهش بده: ' + code;
  else if (S.winner === 3) st = 'مساوی شد';
  else if (S.winner) st = S.winner === side ? '🎉 تو برنده شدی!' : 'حریف برد 😅';
  else st = S.turn === side ? 'نوبت توئه ✨' : 'نوبت حریف...';
  $('st').textContent = st;

  const bd = $('bd');
  bd.className = 'board ' + (xo ? 'xo' : '');
  bd.style.gridTemplateColumns = 'repeat(' + S.n + ',1fr)';
  bd.style.gap = xo ? '8px' : '4px';
  bd.innerHTML = '';
  S.cells.forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'c' + (S.line.includes(i) ? ' win' : '');
    b.disabled = !!v || !!S.winner || side !== S.turn || !S.ready;
    if (v) {
      if (xo) { b.textContent = v === 1 ? 'X' : 'O'; b.classList.add(v === 1 ? 'X' : 'O'); }
      else { const d = document.createElement('div'); d.className = 'ball ' + (v === 1 ? 'b' : 'r'); b.appendChild(d); }
    }
    b.onclick = () => onCell(i);
    bd.appendChild(b);
  });
  $('again').style.display = S.winner ? 'block' : 'none';
  $('gnote').textContent = xo ? '۳ تا پشت سر هم = برد' : '۴ تا توپ هم‌رنگ پشت سر هم (افقی، عمودی یا اریب) = برد';
}
</script>
</body>
</html>
